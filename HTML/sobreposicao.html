            position: relative;

            position: absolute;
            left: 10%;
            right: 10%;
            bottom: -1.8em;
            padding: 1em;
            text-align: center;

        .destaque{

            bottom: 2.5em;
            left: 2em;

            color: white ;          
            padding: 10px 16px;
            border-radius: 30px;
