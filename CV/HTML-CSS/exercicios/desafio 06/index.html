<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>

    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag devera utilizar em cada caso.</p>

    <ul type="square">
        <li title="use a tag &lt;p&gt;">Parágrafos</li>
        <li title="use a tag &lt;h1&gt;... &lt;h6&gt;">Títulos</li>
        <li title="use a tag &lt;img&gt;">Imagens</li>
        <li title="use a tag &lt;abbr&gt;">Abreviações</li>
        <li title="use a tag &lt;code&gt;">Código-Fonte</li>
        <li title="use a tag &lt;ol&gt e &lt;li&gt;">Listas-Numeradas</li>
        <li title="use a tag &lt;ul&gt e &lt;li&gt;">Listas com demarcadores</li>
    </ul>
</body>
</html>
