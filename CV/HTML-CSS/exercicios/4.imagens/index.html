<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com Imagens</title>
</head>
<body>
    <h1>
        Testando carga e imagens
    </h1>

    <p>
        Abaixo você vai ver uma imagem que está na mesma pasta.
    </p>

    <img src="html.png" alt="logo html" width="250px">
    <img src="logo-css-full.webp"logo css3" width="250px">

    <p>Podemos também carregar imagens que estão em sub-pastas.</p>

    <img src="img/html.png" alt="logo html">
    <img src="img/logo-css-full.webp" alt="css3">

    <p>
        Também podemos carregar imagens externas.
    </p>

    <img src="https://logos-world.net/wp-content/uploads/2023/02/JavaScript-Logo.png" alt="Logo Javascript" width="250">
</body>
</html>
